services:
  - type: web
    name: applypilot-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_BASE_URL
        sync: false
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: applypilot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: applypilot-redis
          type: redis
          property: connectionString
  - type: worker
    name: applypilot-worker
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    dockerCommand: celery -A app.worker.celery_app:celery_app worker --loglevel=INFO
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: applypilot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: applypilot-redis
          type: redis
          property: connectionString
  - type: redis
    name: applypilot-redis
    plan: starter
    ipAllowList: []
databases:
  - name: applypilot-db
    plan: basic-256mb
    databaseName: applypilot
    user: applypilot
